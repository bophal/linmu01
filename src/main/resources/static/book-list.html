<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Book List</title>
    <style>
        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 24px;
            padding: 24px;
        }

        .book-card {
            text-align: center;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            transition: transform 0.2s;
        }

        .book-card:hover {
            transform: translateY(-4px);
        }

        /* ✅ Clickable cover style */
        .book-cover-link {
            display: block;
            cursor: pointer;
            position: relative;
        }

        .book-cover-link img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        /* ✅ Overlay shown on hover when PDF exists */
        .pdf-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .book-cover-link:hover .pdf-overlay {
            opacity: 1;
        }

        /* Grayed out cover if no PDF */
        .no-pdf img {
            filter: grayscale(60%);
            cursor: not-allowed;
        }

        .book-title {
            padding: 8px;
            font-weight: bold;
            font-size: 13px;
        }

        .book-author {
            padding: 0 8px 8px;
            font-size: 12px;
            color: gray;
        }
    </style>
</head>
<body>

<h2>Book List</h2>

<div class="book-grid">
    <div class="book-card" th:each="book : ${books}">

        <!-- ✅ If book HAS a PDF: clicking cover opens PDF in new tab -->
        <a th:if="${book.pdfFilePath != null}"
           th:href="@{/books/{id}/view-pdf(id=${book.id})}"
           class="book-cover-link"
           target="_blank"
           th:title="'Read: ' + ${book.title}">

            <img th:src="@{/uploads/covers/{img}(img=${book.coverImagePath})}"
                 th:alt="${book.title}" />

            <div class="pdf-overlay">📖 Read PDF</div>
        </a>

        <!-- ✅ If book has NO PDF: cover is not clickable -->
        <div th:if="${book.pdfFilePath == null}"
             class="book-cover-link no-pdf"
             title="No PDF available">

            <img th:src="@{/uploads/covers/{img}(img=${book.coverImagePath})}"
                 th:alt="${book.title}" />

            <div class="pdf-overlay">🚫 No PDF</div>
        </div>

        <div class="book-title" th:text="${book.title}">Book Title</div>
        <div class="book-author" th:text="${book.author}">Author</div>
    </div>
</div>

</body>
</html>
